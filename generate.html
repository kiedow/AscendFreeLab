<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Генератор карточки — AFL</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>

  <div class="topbar">
    <div class="logo">AFL</div>
    <div class="spacer"></div>
  </div>

  <main class="page">
    <a href="analysis.html" class="back">← Назад</a>

    <h1 class="title">Генератор карточки</h1>
    <p class="subtitle">Загрузи фото и выбери ранг</p>

    <div class="panel">
      <h2>1. Фото 1:1</h2>
      <input type="file" id="photoInput" accept="image/*" class="file-input">
      <div id="photoPreview" class="photo-preview"></div>
    </div>

    <div class="panel">
      <h2>2. Твой ранг</h2>
      <div class="rank-grid" id="rankGrid">
        <button class="rank-btn" data-rank="Sub5" data-num="2.5">Sub5</button>
        <button class="rank-btn" data-rank="LTN" data-num="3.8">LTN</button>
        <button class="rank-btn" data-rank="LTB" data-num="4.7">LTB</button>
        <button class="rank-btn" data-rank="MTN" data-num="5.5">MTN</button>
        <button class="rank-btn" data-rank="HTN" data-num="6.5">HTN</button>
        <button class="rank-btn" data-rank="HTB" data-num="7.4">HTB</button>
        <button class="rank-btn" data-rank="ChadLite" data-num="8.1">ChadLite</button>
        <button class="rank-btn" data-rank="Chad" data-num="8.8">Chad</button>
        <button class="rank-btn" data-rank="AdamLite" data-num="9.5">AdamLite</button>
      </div>
    </div>

    <button class="cat-btn" id="generateBtn" disabled>
      Сгенерировать
      <span class="plus">→</span>
    </button>

    <div id="resultSection" style="display:none;">
      <div class="panel">
        <h2>Результат</h2>
        <div class="result-row">
          <div>
            <div class="result-label">Оценка</div>
            <div class="result-value"><span id="scoreNum"></span> <span id="scoreRank" class="result-rank"></span></div>
          </div>
          <div>
            <div class="result-label">Потенциал</div>
            <div class="result-value"><span id="potNum"></span> <span id="potRank" class="result-rank"></span></div>
          </div>
        </div>
      </div>

      <canvas id="cardCanvas" width="1080" height="1080" style="display:none;"></canvas>
      <img id="cardPreview" class="card-preview" alt="Карточка">

      <button class="cat-btn" id="downloadBtn">
        Скачать PNG
        <span class="plus">↓</span>
      </button>
      <button class="cat-btn" id="sendBtn">
        Отправить в чат
        <span class="plus">→</span>
      </button>
    </div>

  </main>

  <script src="script.js"></script>
</body>
</html>
