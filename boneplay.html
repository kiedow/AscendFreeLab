<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>BonePlay — AFL</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    .game-wrap { display: flex; flex-direction: column; align-items: center; gap: 14px; }
    .stat-bar { display: flex; justify-content: space-between; width: 100%; gap: 12px; }
    .stat-box { flex: 1; background: var(--glass); border: 1px solid var(--glass-border); border-radius: 16px; padding: 12px 14px; text-align: center; backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); }
    .stat-label { font-size: 0.65rem; color: var(--text-mute); letter-spacing: 2px; text-transform: uppercase; margin-bottom: 4px; }
    .stat-value { font-size: 1.3rem; font-weight: 800; color: var(--text); }
    .stat-value.green { color: var(--green); }
    .stat-value.cyan { color: var(--cyan); }
    .avatar-area { position: relative; width: 100%; aspect-ratio: 1; max-width: 340px; margin: 0 auto; border-radius: 24px; background: radial-gradient(circle at 50% 40%, rgba(74,222,128,0.1), transparent 70%); border: 1px solid var(--glass-border); cursor: pointer; overflow: hidden; user-select: none; -webkit-user-select: none; -webkit-tap-highlight-color: transparent; }
    .avatar-area canvas { width: 100%; height: 100%; display: block; }

    /* ==== ТРЯСКА АВАТАРА ==== */
    @keyframes shake {
      0% { transform: translate(0, 0) rotate(0); }
      20% { transform: translate(-6px, -3px) rotate(-2deg); }
      40% { transform: translate(6px, 2px) rotate(2deg); }
      60% { transform: translate(-4px, 3px) rotate(-1deg); }
      80% { transform: translate(4px, -2px) rotate(1deg); }
      100% { transform: translate(0, 0) rotate(0); }
    }
    .avatar-area.shake canvas { animation: shake 0.2s ease; }

    /* ==== ПАДАЮЩИЙ МОЛОТОК ==== */
    .falling-hammer {
      position: absolute;
      width: 80px;
      height: 80px;
      pointer-events: none;
      z-index: 50;
      opacity: 0;
      transform-origin: 50% 100%;
    }

    @keyframes fallDown {
      0% { opacity: 0; transform: translateY(-80px) rotate(var(--angle)); }
      20% { opacity: 1; }
      80% { opacity: 1; transform: translateY(var(--endY)) rotate(var(--angle)); }
      100% { opacity: 0; transform: translateY(var(--endY)) rotate(var(--angle)); }
    }

    /* ==== CSS-МОЛОТКИ ==== */
    /* Плюшевый — мягкий, округлый, бежевый */
    .hammer-plush .hammer-head {
      position: absolute;
      top: 0; left: 10px; right: 10px;
      height: 32px;
      background: radial-gradient(circle at 30% 30%, #e8d4b0, #a8895e);
      border-radius: 16px;
      border: 2px solid #8a6d44;
    }
    .hammer-plush .hammer-handle {
      position: absolute;
      top: 28px; left: 34px;
      width: 12px; height: 50px;
      background: linear-gradient(180deg, #b89a6d, #8a6d44);
      border-radius: 6px;
    }

    /* Магазинный — дерево + металл */
    .hammer-shop .hammer-head {
      position: absolute;
      top: 0; left: 8px; right: 8px;
      height: 30px;
      background: linear-gradient(180deg, #a0a0a0, #6a6a6a);
      border-radius: 6px;
      border: 1px solid #444;
    }
    .hammer-shop .hammer-handle {
      position: absolute;
      top: 26px; left: 34px;
      width: 12px; height: 52px;
      background: linear-gradient(180deg, #8a6a3d, #5a4020);
      border-radius: 5px;
    }

    /* Строительный — массивный серый */
    .hammer-build .hammer-head {
      position: absolute;
      top: 0; left: 4px; right: 4px;
      height: 38px;
      background: linear-gradient(180deg, #707070, #3a3a3a);
      border-radius: 8px;
      border: 2px solid #222;
    }
    .hammer-build .hammer-handle {
      position: absolute;
      top: 34px; left: 32px;
      width: 16px; height: 46px;
      background: linear-gradient(180deg, #555, #222);
      border-radius: 6px;
    }

    /* Массажёр — фиолетовый с шариками */
    .hammer-massage .hammer-head {
      position: absolute;
      top: 0; left: 8px; right: 8px;
      height: 28px;
      background: linear-gradient(180deg, #a374d6, #6b3fa0);
      border-radius: 14px;
      box-shadow: inset 0 0 8px rgba(255,255,255,0.3);
    }
    .hammer-massage .hammer-head::before,
    .hammer-massage .hammer-head::after {
      content: "";
      position: absolute;
      top: 50%; width: 12px; height: 12px;
      background: #d4a8ff;
      border-radius: 50%;
      transform: translateY(-50%);
      box-shadow: 0 0 6px rgba(212,168,255,0.8);
    }
    .hammer-massage .hammer-head::before { left: -4px; }
    .hammer-massage .hammer-head::after { right: -4px; }
    .hammer-massage .hammer-handle {
      position: absolute;
      top: 24px; left: 34px;
      width: 12px; height: 54px;
      background: linear-gradient(180deg, #7a4eb0, #4a2a70);
      border-radius: 6px;
    }

    /* Кувалда — большая тёмная */
    .hammer-sledge .hammer-head {
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 44px;
      background: linear-gradient(180deg, #4a4a4a, #1a1a1a);
      border-radius: 6px;
      border: 2px solid #000;
      box-shadow: inset 0 0 12px rgba(0,0,0,0.8);
    }
    .hammer-sledge .hammer-handle {
      position: absolute;
      top: 40px; left: 34px;
      width: 14px; height: 40px;
      background: linear-gradient(180deg, #6a4a2a, #3a2510);
      border-radius: 5px;
    }

    /* Экскалибур — золотой со свечением */
    .hammer-excalibur .hammer-head {
      position: absolute;
      top: 0; left: 6px; right: 6px;
      height: 34px;
      background: linear-gradient(180deg, #ffe680, #b8860b);
      border-radius: 8px;
      border: 2px solid #8a6508;
      box-shadow: 0 0 16px rgba(255,215,0,0.9), inset 0 0 10px rgba(255,255,255,0.4);
    }
    .hammer-excalibur .hammer-handle {
      position: absolute;
      top: 30px; left: 34px;
      width: 12px; height: 50px;
      background: linear-gradient(180deg, #d4a017, #8a6508);
      border-radius: 6px;
      box-shadow: 0 0 8px rgba(255,215,0,0.6);
    }

    /* Мьют-молот — зелёный неон */
    .hammer-mewing .hammer-head {
      position: absolute;
      top: 0; left: 4px; right: 4px;
      height: 40px;
      background: linear-gradient(180deg, #00ff66, #008a3a);
      border-radius: 10px;
      border: 2px solid #00b34a;
      box-shadow: 0 0 20px rgba(0,255,102,0.9), inset 0 0 12px rgba(255,255,255,0.3);
    }
    .hammer-mewing .hammer-handle {
      position: absolute;
      top: 36px; left: 32px;
      width: 16px; height: 44px;
      background: linear-gradient(180deg, #00b34a, #004d1f);
      border-radius: 6px;
      box-shadow: 0 0 10px rgba(0,255,102,0.6);
    }

    /* ==== ПРОГРЕСС-БАР ==== */
    .rank-progress { width: 100%; max-width: 340px; margin: 0 auto; }
    .rank-labels { display: flex; justify-content: space-between; font-size: 0.7rem; letter-spacing: 2px; text-transform: uppercase; font-weight: 700; color: var(--text-mute); margin-bottom: 6px; }
    .rank-labels .rank-left { color: var(--green); }
    .rank-labels .rank-right { color: var(--cyan); }
    .progress-bar { width: 100%; height: 10px; border-radius: 5px; background: rgba(255,255,255,0.06); overflow: hidden; }
    .progress-fill { height: 100%; background: linear-gradient(90deg, var(--green), var(--cyan)); width: 0%; transition: width 0.15s ease; box-shadow: 0 0 10px rgba(74,222,128,0.6); }
    .bm-text { text-align: center; font-size: 0.75rem; color: var(--text-dim); margin-top: 6px; }

    .hammer-btn { width: 100%; padding: 20px; border-radius: 20px; border: 1.5px solid var(--green); background: rgba(74,222,128,0.08); color: var(--green); font-size: 1.1rem; font-weight: 800; letter-spacing: 2px; text-transform: uppercase; cursor: pointer; font-family: inherit; transition: all 0.1s ease; -webkit-tap-highlight-color: transparent; user-select: none; -webkit-user-select: none; }
    .hammer-btn:active { transform: scale(0.97); background: rgba(74,222,128,0.18); box-shadow: 0 0 20px rgba(74,222,128,0.5); }
    .section-title { font-size: 0.75rem; letter-spacing: 2.5px; text-transform: uppercase; color: var(--text-mute); margin: 20px 0 10px; font-weight: 700; align-self: flex-start; }
    .shop-item { display: flex; align-items: center; justify-content: space-between; padding: 14px 16px; border-radius: 14px; border: 1px solid var(--glass-border); background: rgba(255,255,255,0.025); margin-bottom: 8px; gap: 12px; width: 100%; }
    .shop-item.owned { border-color: rgba(74,222,128,0.4); background: rgba(74,222,128,0.06); }
    .shop-item.active { border-color: var(--green); box-shadow: 0 0 12px rgba(74,222,128,0.3); }
    .shop-item.locked { opacity: 0.4; }
    .shop-info { flex: 1; min-width: 0; text-align: left; }
    .shop-name { font-size: 0.95rem; font-weight: 700; color: var(--text); margin-bottom: 3px; }
    .shop-sub { font-size: 0.75rem; color: var(--text-dim); }
    .shop-buy { padding: 10px 16px; border-radius: 12px; border: 1px solid var(--green); background: rgba(74,222,128,0.08); color: var(--green); font-size: 0.85rem; font-weight: 700; cursor: pointer; font-family: inherit; white-space: nowrap; transition: all 0.15s; }
    .shop-buy:disabled { opacity: 0.35; cursor: not-allowed; border-color: var(--glass-border); color: var(--text-mute); background: transparent; }
    .shop-buy:not(:disabled):active { background: rgba(74,222,128,0.2); }
    .levelup-toast { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%) scale(0.8); background: rgba(10,10,10,0.95); border: 2px solid var(--green); border-radius: 20px; padding: 24px 32px; text-align: center; box-shadow: 0 0 40px rgba(74,222,128,0.6); opacity: 0; pointer-events: none; transition: all 0.35s ease; z-index: 100; backdrop-filter: blur(20px); }
    .levelup-toast.show { opacity: 1; transform: translate(-50%, -50%) scale(1); }
    .levelup-toast .lv-label { font-size: 0.7rem; letter-spacing: 3px; text-transform: uppercase; color: var(--text-mute); margin-bottom: 6px; }
    .levelup-toast .lv-name { font-size: 1.6rem; font-weight: 900; color: var(--green); letter-spacing: 1px; text-shadow: 0 0 16px rgba(74,222,128,0.8); }
    .float-text { position: absolute; color: var(--green); font-weight: 800; font-size: 1.1rem; pointer-events: none; animation: floatUp 0.7s ease-out forwards; text-shadow: 0 0 10px rgba(74,222,128,0.8); z-index: 60; }
    @keyframes floatUp { 0% { opacity: 1; transform: translateY(0); } 100% { opacity: 0; transform: translateY(-60px); } }
    .reset-btn { margin-top: 24px; width: 100%; padding: 12px; border-radius: 14px; border: 1px solid rgba(255,80,80,0.3); background: transparent; color: rgba(255,80,80,0.8); font-size: 0.8rem; font-weight: 600; cursor: pointer; font-family: inherit; }
    .roupe-btn { width: 100%; margin-top: 16px; padding: 18px; border-radius: 18px; border: 2px solid #ffd700; background: rgba(255,215,0,0.08); color: #ffd700; font-size: 1.1rem; font-weight: 800; letter-spacing: 3px; text-transform: uppercase; cursor: pointer; font-family: inherit; box-shadow: 0 0 24px rgba(255,215,0,0.4); }
    .roupe-btn:active { transform: scale(0.97); }
    .cjc-modal { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.85); z-index: 200; display: none; align-items: center; justify-content: center; padding: 20px; backdrop-filter: blur(8px); }
    .cjc-modal.show { display: flex; }
    .cjc-inner { background: #111; border: 2px solid var(--green); border-radius: 20px; padding: 24px; max-width: 400px; width: 100%; }
    .cjc-title { font-size: 1.1rem; font-weight: 800; color: var(--green); text-align: center; margin-bottom: 16px; letter-spacing: 1px; }
    .cjc-option { display: block; width: 100%; padding: 14px; margin-bottom: 8px; border-radius: 12px; border: 1px solid var(--glass-border); background: rgba(255,255,255,0.04); color: var(--text); font-family: inherit; font-size: 0.9rem; cursor: pointer; text-align: left; }
    .cjc-option.selected { border-color: var(--green); background: rgba(74,222,128,0.15); color: var(--green); }
    .cjc-confirm { width: 100%; padding: 14px; margin-top: 12px; border-radius: 12px; border: none; background: var(--green); color: #000; font-weight: 800; font-family: inherit; font-size: 1rem; cursor: pointer; }
    .cjc-confirm:disabled { opacity: 0.3; cursor: not-allowed; }
    .cjc-cancel { width: 100%; padding: 10px; margin-top: 8px; border: none; background: transparent; color: var(--text-mute); font-family: inherit; font-size: 0.85rem; cursor: pointer; }
  </style>
</head>
<body>

  <div class="topbar">
    <div class="logo">AFL</div>
    <div class="spacer"></div>
  </div>

  <main class="page">
    <h1 class="title">Bone<span class="accent">Play</span></h1>
    <p class="subtitle">Smash. Grow. Ascend.</p>

    <div class="game-wrap">
      <div class="stat-bar">
        <div class="stat-box">
          <div class="stat-label">Удары</div>
          <div class="stat-value cyan" id="hitsDisplay">0</div>
        </div>
        <div class="stat-box">
          <div class="stat-label">Bonemass</div>
          <div class="stat-value green" id="bmDisplay">0</div>
        </div>
      </div>

      <div class="avatar-area" id="avatarArea">
        <canvas id="avatarCanvas" width="600" height="600"></canvas>
      </div>

      <div class="rank-progress">
        <div class="rank-labels">
          <span class="rank-left" id="rankLeft">Sub5</span>
          <span class="rank-right" id="rankRight">LTN</span>
        </div>
        <div class="progress-bar">
          <div class="progress-fill" id="progressFill"></div>
        </div>
        <div class="bm-text" id="bmText">0 / 10.0K</div>
      </div>

      <button class="hammer-btn" id="hammerBtn">🔨 SMASH</button>

      <div id="roupeWrap" style="display:none; width:100%;">
        <button class="roupe-btn" id="roupeBtn">ROUPE</button>
      </div>

      <div class="section-title">Молотки</div>
      <div id="hammersList" style="width:100%;"></div>

      <div class="section-title">Баффы</div>
      <div id="buffsList" style="width:100%;"></div>

      <button class="reset-btn" id="resetBtn">Сбросить прогресс</button>
    </div>
  </main>

  <div class="levelup-toast" id="toast">
    <div class="lv-label">Новый уровень</div>
    <div class="lv-name" id="toastName">LTN</div>
  </div>

  <div class="cjc-modal" id="cjcModal">
    <div class="cjc-inner">
      <div class="cjc-title">CJC-1295 — выбери 2 баффа</div>
      <div id="cjcOptions"></div>
      <button class="cjc-confirm" id="cjcConfirm" disabled>Подтвердить</button>
      <button class="cjc-cancel" id="cjcCancel">Отмена</button>
    </div>
  </div>

  <nav class="bottom-nav">
    <a href="index.html" class="nav-item">
      <svg viewBox="0 0 24 24"><path d="M3 10l9-7 9 7v10a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
      <span>Главная</span>
    </a>
    <a href="academy.html" class="nav-item">
      <svg viewBox="0 0 24 24"><path d="M22 10L12 5 2 10l10 5 10-5z"/><path d="M6 12v5c0 1.5 3 3 6 3s6-1.5 6-3v-5"/></svg>
      <span>Академия</span>
    </a>
    <a href="boneplay.html" class="nav-item">
      <svg viewBox="0 0 24 24"><path d="M14 3l7 7-4 4-7-7z"/><path d="M10 7l-7 7 4 4 7-7"/></svg>
      <span>BonePlay</span>
    </a>
    <a href="profile.html" class="nav-item">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-7 8-7s8 3 8 7"/></svg>
      <span>Профиль</span>
    </a>
  </nav>

  <script>
  (function () {
    // ==== НАСТРОЙКИ (читаются из профиля) ====
    function settingOn(key, def) {
      try {
        const v = localStorage.getItem('afl_setting_' + key);
        if (v === '0') return false;
        if (v === '1') return true;
      } catch (e) {}
      return def;
    }
    let SETTINGS = {
      animations: settingOn('animations', true),
      vibration: settingOn('vibration', true),
      sound: settingOn('sound', true),
    };

    // ==== УРОВНИ ====
    const LEVELS = [
      { name: 'Sub5',      need: 0,          mult: 1, img: 'image/sub5.png' },
      { name: 'LTN',       need: 10000,      mult: 2, img: 'image/ltn.png' },
      { name: 'MTN',       need: 85000,      mult: 3, img: 'image/mtn.png' },
      { name: 'HTN',       need: 435000,     mult: 4, img: 'image/htn.png' },
      { name: 'ChadLite',  need: 1935000,    mult: 5, img: 'image/chadlite.png' },
      { name: 'Chad',      need: 8935000,    mult: 6, img: 'image/chad.png' },
      { name: 'AdamLite',  need: 53935000,   mult: 7, img: 'image/adamlite.png' },
      { name: 'Gigachad',  need: 403935000,  mult: 8, img: 'image/gigachad.png' },
    ];

    // ==== МОЛОТКИ (класс для CSS + тип звука) ====
    const HAMMERS = [
      { id: 0, name: 'Плюшевый',      price: 0,         dmg: 1,   cssClass: 'hammer-plush',       sound: 'soft' },
      { id: 1, name: 'Магазинный',    price: 2700,      dmg: 7,   cssClass: 'hammer-shop',        sound: 'wood' },
      { id: 2, name: 'Строительный',  price: 10800,     dmg: 12,  cssClass: 'hammer-build',       sound: 'metal' },
      { id: 3, name: 'Массажёр',      price: 76500,     dmg: 19,  cssClass: 'hammer-massage',     sound: 'click' },
      { id: 4, name: 'Кувалда',       price: 355500,    dmg: 47,  cssClass: 'hammer-sledge',      sound: 'boom' },
      { id: 5, name: 'Экскалибур',    price: 1800000,   dmg: 180, cssClass: 'hammer-excalibur',   sound: 'shine' },
      { id: 6, name: 'Мьют-молот',    price: 9000000,   dmg: 790, cssClass: 'hammer-mewing',      sound: 'mewing' },
    ];

    const BUFFS = [
      { id: 'retatrutide', name: 'Retatrutide', price: 2500,    mult: 2, minLevel: 0, duration: 0 },
      { id: 'ghkcu',       name: 'GHK-Cu',      price: 15000,   mult: 3, minLevel: 1, duration: 0 },
      { id: 'bpc157',      name: 'BPC-157',     price: 59000,   mult: 5, minLevel: 2, duration: 120 },
      { id: 'cjc',         name: 'CJC-1295',    price: 1000000, mult: 1, minLevel: 3, duration: 0 },
    ];

    const loadedImages = LEVELS.map(l => {
      const img = new Image();
      img.src = l.img;
      return img;
    });

    const STORAGE_KEY = 'boneplay_save_v4';
    const IS_TELEGRAM = !!(window.Telegram && window.Telegram.WebApp && window.Telegram.WebApp.initData);

    let state = {
      level: 0, bm: 0, hits: 0, hammer: 0,
      ownedHammers: [0], buff: null, activeBuffs: [],
      ownedBuffs: [], bpcUntil: 0, roupeBonus: false,
    };

    function save() {
      const data = JSON.stringify(state);
      try {
        if (IS_TELEGRAM && window.Telegram.WebApp.CloudStorage) {
          window.Telegram.WebApp.CloudStorage.setItem(STORAGE_KEY, data, () => {});
        } else {
          localStorage.setItem(STORAGE_KEY, data);
        }
      } catch (e) {}
    }

    function load(cb) {
      try {
        if (IS_TELEGRAM && window.Telegram.WebApp.CloudStorage) {
          window.Telegram.WebApp.CloudStorage.getItem(STORAGE_KEY, (err, value) => {
            if (!err && value) { try { state = Object.assign(state, JSON.parse(value)); } catch (e) {} }
            cb();
          });
        } else {
          const raw = localStorage.getItem(STORAGE_KEY);
          if (raw) state = Object.assign(state, JSON.parse(raw));
          cb();
        }
      } catch (e) { cb(); }
    }

    const hitsDisplay = document.getElementById('hitsDisplay');
    const bmDisplay = document.getElementById('bmDisplay');
    const avatarArea = document.getElementById('avatarArea');
    const canvas = document.getElementById('avatarCanvas');
    const ctx = canvas.getContext('2d');
    const progressFill = document.getElementById('progressFill');
    const rankLeft = document.getElementById('rankLeft');
    const rankRight = document.getElementById('rankRight');
    const bmText = document.getElementById('bmText');
    const hammerBtn = document.getElementById('hammerBtn');
    const hammersList = document.getElementById('hammersList');
    const buffsList = document.getElementById('buffsList');
    const resetBtn = document.getElementById('resetBtn');
    const toast = document.getElementById('toast');
    const toastName = document.getElementById('toastName');
    const roupeWrap = document.getElementById('roupeWrap');
    const roupeBtn = document.getElementById('roupeBtn');
    const cjcModal = document.getElementById('cjcModal');
    const cjcOptions = document.getElementById('cjcOptions');
    const cjcConfirm = document.getElementById('cjcConfirm');
    const cjcCancel = document.getElementById('cjcCancel');

    function fmt(n) {
      if (n >= 1e12) return (n/1e12).toFixed(2) + 'T';
      if (n >= 1e9)  return (n/1e9).toFixed(2) + 'B';
      if (n >= 1e6)  return (n/1e6).toFixed(2) + 'M';
      if (n >= 1e3)  return (n/1e3).toFixed(1) + 'K';
      return Math.floor(n).toString();
    }

    function getActiveMult() {
      const now = Date.now();
      if (state.bpcUntil > now) return 5;
      if (state.activeBuffs && state.activeBuffs.length > 0) {
        let m = 1;
        state.activeBuffs.forEach(id => {
          const b = BUFFS.find(x => x.id === id);
          if (b) m *= b.mult;
        });
        return m;
      }
      if (state.buff) {
        const b = BUFFS.find(x => x.id === state.buff);
        if (b) return b.mult;
      }
      return 1;
    }

    function currentDmg() {
      const base = HAMMERS[state.hammer].dmg;
      const mult = getActiveMult();
      const rankMult = LEVELS[state.level].mult;
      const roupe = state.roupeBonus ? 2 : 1;
      return base * mult * rankMult * roupe;
    }

    function currentHitsPerTap() {
      return getActiveMult() * LEVELS[state.level].mult * (state.roupeBonus ? 2 : 1);
    }

    function drawAvatar() {
      const W = 600, H = 600;
      ctx.clearRect(0, 0, W, H);
      const grad = ctx.createRadialGradient(W/2, H/2, 0, W/2, H/2, W/2);
      grad.addColorStop(0, 'rgba(74,222,128,0.12)');
      grad.addColorStop(1, 'rgba(0,0,0,0)');
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, W, H);
      const img = loadedImages[state.level];
      if (img && img.complete && img.naturalWidth > 0) {
        const scale = Math.min(W / img.width, H / img.height) * 0.95;
        const dw = img.width * scale;
        const dh = img.height * scale;
        ctx.drawImage(img, (W - dw) / 2, (H - dh) / 2, dw, dh);
      } else {
        ctx.fillStyle = 'rgba(255,255,255,0.1)';
        ctx.font = 'bold 40px sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText(LEVELS[state.level].name, W/2, H/2);
      }
    }

    function updateUI() {
      hitsDisplay.textContent = fmt(state.hits);
      bmDisplay.textContent = fmt(state.bm);
      const cur = LEVELS[state.level];
      const isMax = state.level === LEVELS.length - 1;
      if (isMax) {
        rankLeft.textContent = cur.name;
        rankRight.textContent = 'MAX';
        progressFill.style.width = '100%';
        bmText.textContent = fmt(state.bm) + ' — финал';
      } else {
        const next = LEVELS[state.level + 1];
        const from = cur.need;
        const to = next.need;
        const pct = Math.max(0, Math.min(100, ((state.bm - from) / (to - from)) * 100));
        rankLeft.textContent = cur.name;
        rankRight.textContent = next.name;
        progressFill.style.width = pct + '%';
        bmText.textContent = fmt(state.bm) + ' / ' + fmt(to);
      }
      roupeWrap.style.display = isMax ? 'block' : 'none';
      drawAvatar();
      renderShop();
      save();
    }

    function renderShop() {
      hammersList.innerHTML = '';
      HAMMERS.forEach((h, i) => {
        const owned = state.ownedHammers.includes(i);
        const active = state.hammer === i;
        const div = document.createElement('div');
        div.className = 'shop-item' + (owned ? ' owned' : '') + (active ? ' active' : '');
        div.innerHTML = `
          <div class="shop-info">
            <div class="shop-name">${h.name}</div>
            <div class="shop-sub">Урон: ${h.dmg} · ${owned ? (active ? 'Активен' : 'Куплен') : 'Цена: ' + fmt(h.price) + ' 💥'}</div>
          </div>
          ${owned ? (active ? '' : `<button class="shop-buy" data-hammer="${i}">Выбрать</button>`) : `<button class="shop-buy" data-hammer-buy="${i}" ${state.hits < h.price ? 'disabled' : ''}>Купить</button>`}
        `;
        hammersList.appendChild(div);
      });

      buffsList.innerHTML = '';
      const now = Date.now();
      BUFFS.forEach((b) => {
        const owned = state.ownedBuffs.includes(b.id);
        const active = state.buff === b.id || (state.activeBuffs || []).includes(b.id);
        const bpcActive = b.id === 'bpc157' && state.bpcUntil > now;
        const locked = state.level < b.minLevel;
        const div = document.createElement('div');
        div.className = 'shop-item' + (owned ? ' owned' : '') + ((active || bpcActive) ? ' active' : '') + (locked ? ' locked' : '');
        let statusText = '';
        if (locked) statusText = `Откроется на ${LEVELS[b.minLevel].name}`;
        else if (b.id === 'cjc') statusText = owned ? 'Куплен · 2 баффа одновременно' : `Цена: ${fmt(b.price)} 💥 · 2 баффа`;
        else if (b.duration > 0) {
          if (bpcActive) { const sec = Math.ceil((state.bpcUntil - now) / 1000); statusText = `×${b.mult} · осталось ${sec}с`; }
          else statusText = `×${b.mult} на ${b.duration}сек · ${owned ? 'Куплен' : 'Цена: ' + fmt(b.price) + ' 💥'}`;
        } else statusText = `×${b.mult} (удары + урон) · ${owned ? (active ? 'Активен' : 'Куплен') : 'Цена: ' + fmt(b.price) + ' 💥'}`;
        div.innerHTML = `
          <div class="shop-info"><div class="shop-name">${b.name}</div><div class="shop-sub">${statusText}</div></div>
          ${locked ? '' : (owned ? (b.id === 'cjc' ? `<button class="shop-buy" data-cjc-open="1">Настроить</button>` : (b.duration > 0 ? `<button class="shop-buy" data-buff-activate="${b.id}" ${bpcActive ? 'disabled' : ''}>${bpcActive ? 'Активен' : 'Активировать'}</button>` : (active ? '' : `<button class="shop-buy" data-buff="${b.id}">Активировать</button>`))) : `<button class="shop-buy" data-buff-buy="${b.id}" ${state.hits < b.price ? 'disabled' : ''}>Купить</button>`)}
        `;
        buffsList.appendChild(div);
      });

      hammersList.querySelectorAll('[data-hammer-buy]').forEach(btn => {
        btn.onclick = () => {
          const i = parseInt(btn.dataset.hammerBuy);
          const h = HAMMERS[i];
          if (state.hits >= h.price && !state.ownedHammers.includes(i)) {
            state.hits -= h.price;
            state.ownedHammers.push(i);
            state.hammer = i;
            updateUI();
          }
        };
      });
      hammersList.querySelectorAll('[data-hammer]').forEach(btn => {
        btn.onclick = () => { state.hammer = parseInt(btn.dataset.hammer); updateUI(); };
      });
      buffsList.querySelectorAll('[data-buff-buy]').forEach(btn => {
        btn.onclick = () => {
          const id = btn.dataset.buffBuy;
          const b = BUFFS.find(x => x.id === id);
          if (state.hits >= b.price && !state.ownedBuffs.includes(id)) {
            state.hits -= b.price;
            state.ownedBuffs.push(id);
            if (b.id === 'cjc') {}
            else if (b.duration > 0) { state.bpcUntil = Date.now() + b.duration * 1000; state.buff = null; state.activeBuffs = []; }
            else { state.buff = id; state.activeBuffs = []; }
            updateUI();
          }
        };
      });
      buffsList.querySelectorAll('[data-buff-activate]').forEach(btn => {
        btn.onclick = () => {
          const id = btn.dataset.buffActivate;
          const b = BUFFS.find(x => x.id === id);
          if (b && b.duration > 0) { state.bpcUntil = Date.now() + b.duration * 1000; state.buff = null; state.activeBuffs = []; updateUI(); }
        };
      });
      buffsList.querySelectorAll('[data-buff]').forEach(btn => {
        btn.onclick = () => { state.buff = btn.dataset.buff; state.activeBuffs = []; updateUI(); };
      });
      buffsList.querySelectorAll('[data-cjc-open]').forEach(btn => {
        btn.onclick = () => openCjcModal();
      });
    }

    let cjcSelected = [];
    function openCjcModal() {
      cjcSelected = [];
      cjcOptions.innerHTML = '';
      const available = BUFFS.filter(b => b.id !== 'cjc' && state.ownedBuffs.includes(b.id));
      if (available.length < 2) { alert('Нужно купить минимум 2 других баффа'); return; }
      available.forEach(b => {
        const btn = document.createElement('button');
        btn.className = 'cjc-option';
        btn.textContent = `${b.name} (×${b.mult})`;
        btn.onclick = () => {
          if (cjcSelected.includes(b.id)) { cjcSelected = cjcSelected.filter(x => x !== b.id); btn.classList.remove('selected'); }
          else if (cjcSelected.length < 2) { cjcSelected.push(b.id); btn.classList.add('selected'); }
          cjcConfirm.disabled = cjcSelected.length !== 2;
        };
        cjcOptions.appendChild(btn);
      });
      cjcConfirm.disabled = true;
      cjcModal.classList.add('show');
    }
    cjcConfirm.onclick = () => {
      if (cjcSelected.length === 2) {
        state.activeBuffs = [...cjcSelected];
        state.buff = null;
        state.bpcUntil = 0;
        cjcModal.classList.remove('show');
        updateUI();
      }
    };
    cjcCancel.onclick = () => { cjcModal.classList.remove('show'); };

    // ==== ЗВУК (Web Audio синтез) ====
    let audioCtx = null;
    function playHitSound(type) {
      if (!SETTINGS.sound) return;
      try {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const now = audioCtx.currentTime;

        // Базовые параметры
        let freq = 120;
        let dur = 0.12;
        let vol = 0.35;
        let typeWave = 'sine';

        if (type === 'soft')  { freq = 90;  dur = 0.15; vol = 0.25; typeWave = 'sine'; }
        if (type === 'wood')  { freq = 180; dur = 0.08; vol = 0.35; typeWave = 'triangle'; }
        if (type === 'metal') { freq = 320; dur = 0.06; vol = 0.3;  typeWave = 'square'; }
        if (type === 'click') { freq = 700; dur = 0.03; vol = 0.2;  typeWave = 'sine'; }
        if (type === 'boom')  { freq = 60;  dur = 0.25; vol = 0.5;  typeWave = 'sine'; }
        if (type === 'shine') { freq = 500; dur = 0.1;  vol = 0.3;  typeWave = 'triangle'; }
        if (type === 'mewing'){ freq = 50;  dur = 0.3;  vol = 0.55; typeWave = 'sine'; }

        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = typeWave;
        osc.frequency.setValueAtTime(freq, now);
        osc.frequency.exponentialRampToValueAtTime(Math.max(30, freq * 0.3), now + dur);
        gain.gain.setValueAtTime(vol, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + dur);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start(now);
        osc.stop(now + dur);

        // Шум для "металла" и "бума"
        if (type === 'metal' || type === 'boom' || type === 'mewing') {
          const bufSize = audioCtx.sampleRate * dur;
          const buffer = audioCtx.createBuffer(1, bufSize, audioCtx.sampleRate);
          const data = buffer.getChannelData(0);
          for (let i = 0; i < bufSize; i++) data[i] = (Math.random() * 2 - 1) * (1 - i / bufSize);
          const noise = audioCtx.createBufferSource();
          noise.buffer = buffer;
          const nGain = audioCtx.createGain();
          nGain.gain.setValueAtTime(vol * 0.4, now);
          nGain.gain.exponentialRampToValueAtTime(0.001, now + dur);
          noise.connect(nGain);
          nGain.connect(audioCtx.destination);
          noise.start(now);
        }
      } catch (e) {}
    }

    // ==== ВИБРАЦИЯ ====
    function vibrate() {
      if (!SETTINGS.vibration) return;
      try { if (navigator.vibrate) navigator.vibrate(10); } catch (e) {}
    }

    // ==== МОЛОТОК ПАДАЕТ ====
    function spawnFallingHammer() {
      if (!SETTINGS.animations) return;
      const hammer = HAMMERS[state.hammer];
      const el = document.createElement('div');
      el.className = 'falling-hammer ' + hammer.cssClass;

      // Внутренности
      el.innerHTML = '<div class="hammer-head"></div><div class="hammer-handle"></div>';

      // Позиция по горизонтали (случайно)
      const posX = 10 + Math.random() * 60; // % от ширины
      const angle = -30 + Math.random() * 60; // -30..+30 градусов
      const endY = 160 + Math.random() * 60; // куда долетает

      el.style.left = posX + '%';
      el.style.setProperty('--angle', angle + 'deg');
      el.style.setProperty('--endY', endY + 'px');

      // Анимация
      el.style.animation = 'fallDown 0.15s ease-in forwards';

      avatarArea.appendChild(el);

      // Убираем через 300 мс
      setTimeout(() => el.remove(), 300);
    }

    // ==== УДАР ====
    function smash() {
      const dmg = currentDmg();
      const hitsGain = currentHitsPerTap();

      state.bm += dmg;
      state.hits += hitsGain;

      // Звук
      playHitSound(HAMMERS[state.hammer].sound);

      // Вибрация
      vibrate();

      // Молоток падает
      spawnFallingHammer();

      // Тряска аватара
      if (SETTINGS.animations) {
        avatarArea.classList.remove('shake');
        void avatarArea.offsetWidth;
        avatarArea.classList.add('shake');
        setTimeout(() => avatarArea.classList.remove('shake'), 220);
      }

      // Float-текст
      if (SETTINGS.animations) {
        const float = document.createElement('div');
        float.className = 'float-text';
        float.textContent = '+' + fmt(dmg);
        float.style.left = (Math.random() * 60 + 20) + '%';
        float.style.top = (Math.random() * 30 + 30) + '%';
        avatarArea.appendChild(float);
        setTimeout(() => float.remove(), 700);
      }

      // Проверка перехода
      if (state.level < LEVELS.length - 1) {
        const nextNeed = LEVELS[state.level + 1].need;
        if (state.bm >= nextNeed) {
          state.level++;
          showToast(LEVELS[state.level].name + ' ×' + LEVELS[state.level].mult);
        }
      }

      updateUI();
    }

    function showToast(name) {
      toastName.textContent = name;
      toast.classList.add('show');
      setTimeout(() => toast.classList.remove('show'), 1800);
    }

    hammerBtn.addEventListener('click', (e) => { e.preventDefault(); smash(); });
    avatarArea.addEventListener('click', (e) => { e.preventDefault(); smash(); });

    roupeBtn.addEventListener('click', () => {
      if (!confirm('Roupe? Прогресс сбросится, ты получишь ×2 к урону навсегда.')) return;
      state = { level: 0, bm: 0, hits: 0, hammer: 0, ownedHammers: [0], buff: null, activeBuffs: [], ownedBuffs: [], bpcUntil: 0, roupeBonus: true };
      updateUI();
    });
    resetBtn.addEventListener('click', () => {
      if (confirm('Полный сброс (включая бонус Roupe)?')) {
        state = { level: 0, bm: 0, hits: 0, hammer: 0, ownedHammers: [0], buff: null, activeBuffs: [], ownedBuffs: [], bpcUntil: 0, roupeBonus: false };
        updateUI();
      }
    });

    setInterval(() => {
      if (state.bpcUntil > 0 && state.bpcUntil < Date.now()) { state.bpcUntil = 0; updateUI(); }
    }, 1000);

    load(() => { updateUI(); });
  })();
  </script>
